services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sexparty
      POSTGRES_PASSWORD: sexparty
      POSTGRES_DB: sexparty
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sexparty -d sexparty"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: SexParty API
      ENVIRONMENT: development
      API_PUBLIC_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SESSION_SECRET: local-dev-change-me
      AUTO_CREATE_TABLES: "true"
      DATABASE_URL: postgresql+asyncpg://sexparty:sexparty@postgres:5432/sexparty
      REDIS_URL: ""
      MAX_UPLOAD_SIZE_MB: "2048"
      LOCAL_UPLOAD_DIR: uploads
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SOCKET_URL: http://localhost:8000
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
